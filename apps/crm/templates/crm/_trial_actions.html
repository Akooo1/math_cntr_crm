<form method="post" action="{% url 'crm:trial_status' tr.pk %}" class="flex flex-wrap gap-1.5">{% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button name="status" value="attended" class="btn-secondary px-3 text-emerald-700">{% translate "Came" %}</button>
  <button name="status" value="no_show" class="btn-secondary px-3">{% translate "Did not come" %}</button>
  <button name="status" value="cancelled" class="btn-ghost px-3">{% translate "Cancel" %}</button>
</form>
