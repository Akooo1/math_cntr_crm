<a href="{% url 'crm:board' %}" class="card block p-5 hover:border-sky-300 md:col-span-1 xl:col-span-2">
  <p class="text-sm font-medium text-slate-500">{% translate "Leads by stage" %}</p>
  <ul class="mt-3 grid grid-cols-2 gap-2 sm:grid-cols-3">
    {% for s in ctx.stages %}<li class="flex items-center justify-between gap-2 rounded-lg px-3 py-2 {{ s.stage.badge_css }}"><span class="truncate text-sm">{{ s.stage.name }}</span><span class="font-semibold">{{ s.count }}</span></li>{% endfor %}
  </ul>
</a>
