<a href="{% url 'crm:tasks' %}" class="card block p-5">
  <div class="card-head"><p class="card-title">{% translate "My tasks" %}</p><span class="arrow-dot">{% icon "arrow-up-right" "w-4 h-4" %}</span></div>
  <div class="mt-3 flex items-end gap-6">
    <div><p class="text-3xl font-semibold {% if ctx.counts.overdue %}text-rose-700{% endif %}">{{ ctx.counts.overdue }}</p><p class="text-sm text-slate-500">{% translate "Overdue" %}</p></div>
    <div><p class="text-3xl font-semibold">{{ ctx.counts.today }}</p><p class="text-sm text-slate-500">{% translate "Today" %}</p></div>
    <div><p class="text-3xl font-semibold text-slate-500">{{ ctx.counts.upcoming }}</p><p class="text-sm text-slate-500">{% translate "Upcoming" %}</p></div>
  </div>
</a>
