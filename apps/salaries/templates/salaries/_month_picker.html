<form method="get" class="flex items-center gap-2">
  <select name="oy" data-autosubmit class="input w-auto" aria-label="{% translate 'Month' %}">
    {% for m in months %}<option value="{{ m|date:'m.Y' }}" {% if m == month %}selected{% endif %}>{{ m|date:"F Y" }}</option>{% endfor %}
  </select>
  <noscript><button class="btn-secondary">{% translate "Show" %}</button></noscript>
</form>
