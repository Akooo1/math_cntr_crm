<a href="{% url 'students:list' %}?holat=kutilmoqda" class="card block p-5">
  <div class="card-head"><p class="card-title">{% translate "Awaiting enrollment" %}</p><span class="arrow-dot">{% icon "arrow-up-right" "w-4 h-4" %}</span></div>
  <p class="mt-2 text-3xl font-semibold {% if ctx.count %}text-amber-700{% endif %}">{{ ctx.count }}</p>
  <ul class="mt-2 space-y-1 text-sm text-slate-600">{% for s in ctx.students %}<li>{{ s.full_name }}</li>{% endfor %}</ul>
</a>
