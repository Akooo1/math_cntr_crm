# Development: live code reload, demo data, CSS watcher. Loaded automatically by
# `docker compose up`.
services:
  web:
    image: matematika-web:dev
    build:
      target: dev
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: dev-insecure-key-change-me
      # Demo data on by default. Clean start: DEMO_SEED=0 plus your own Direktor below
      # (see README, "Start clean").
      DEMO_SEED: ${DEMO_SEED:-1}
      DIRECTOR_PHONE: ${DIRECTOR_PHONE:-}
      DIRECTOR_NAME: ${DIRECTOR_NAME:-}
      DIRECTOR_PASSWORD: ${DIRECTOR_PASSWORD:-}
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  # Telegram bot for local testing: put TELEGRAM_BOT_TOKEN=... into .env first.
  bot:
    image: matematika-web:dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-matematika}
      POSTGRES_USER: ${POSTGRES_USER:-mm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mm}
      POSTGRES_HOST: db
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: dev-insecure-key-change-me
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      SKIP_MIGRATE: "1"
    command: ["python", "manage.py", "telegram_bot"]
    volumes:
      - .:/app
    depends_on:
      - web
    restart: unless-stopped

  css:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npx tailwindcss -i assets/app.css -o static/dist/app.css --watch=always"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
