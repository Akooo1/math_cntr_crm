{# The center name in the logo's style: first word navy, the rest blue (MATEMATIKA / MARKAZI). #}
{% with parts=center_name.split %}<span class="font-display text-sm font-bold uppercase leading-tight tracking-wide"><span class="block text-sky-800">{{ parts.0 }}</span>{% if parts|length > 1 %}<span class="block text-sky-500">{{ parts|slice:"1:"|join:" " }}</span>{% endif %}</span>{% endwith %}
