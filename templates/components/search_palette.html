{# Key caps are not translated: they are printed on the keyboard. #}
{# Global search (Ctrl+K, or the search icon on phones). Results: core:search, via htmx. #}
<div data-palette hidden>
  <div class="palette-backdrop" data-palette-close></div>
  <div class="palette" role="dialog" aria-modal="true" aria-label="{% translate 'Search' %}">
    <form class="flex items-center gap-1 pl-4 pr-2" action="{% url 'core:search' %}" method="get" role="search" data-no-busy onsubmit="return false">
      <span class="text-muted">{% icon "search" "w-5 h-5" %}</span>
      <input class="palette-input" type="search" name="q" autocomplete="off" spellcheck="false" data-palette-input
             placeholder="{% translate 'Student, lead, group or receipt number' %}" aria-label="{% translate 'Search' %}"
             aria-controls="palette-results" aria-autocomplete="list"
             hx-get="{% url 'core:search' %}" hx-trigger="input changed delay:200ms, search" hx-target="#palette-results" hx-sync="this:replace" hx-indicator="#palette-spinner">
      <span id="palette-spinner" class="htmx-indicator spinner text-muted"></span>
      <button type="button" class="btn-ghost btn-icon" data-palette-close aria-label="{% translate 'Close' %}">{% icon "x" %}</button>
    </form>
    <div id="palette-results" class="palette-results" role="listbox" aria-label="{% translate 'Search results' %}"></div>
    <div class="hidden items-center gap-4 border-t border-line px-4 py-2 text-xs text-muted md:flex">
      <span><span class="kbd">↑</span> <span class="kbd">↓</span> {% translate "move" %}</span>
      <span><span class="kbd">↵</span> {% translate "open" %}</span>
      <span><span class="kbd">{{ "Esc" }}</span> {% translate "close" %}</span>
    </div>
  </div>
</div>
