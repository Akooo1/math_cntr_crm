{% extends "base.html" %}
{% block title %}{% translate "Search" %}{% endblock %}
{% block heading %}{% translate "Search" %}{% endblock %}
{% block content %}
  <form method="get" class="mb-4 flex gap-2" role="search">
    <label for="search-q" class="sr-only">{% translate "Search" %}</label>
    <input id="search-q" type="search" name="q" value="{{ q }}" class="input" placeholder="{% translate 'Student, lead, group or receipt number' %}" autofocus>
    <button class="btn-primary">{% icon "search" %}<span>{% translate "Search" %}</span></button>
  </form>
  <div class="card p-1.5">{% include "core/_search_results.html" %}</div>
{% endblock %}
