<div class="mt-3 flex flex-wrap justify-end gap-2 md:mt-0">
  {% if r.can_edit %}<a href="{% url 'settings:section_edit' section.slug r.obj.pk %}" class="btn-secondary">{% icon "pencil" "w-4 h-4" %}{% translate "Edit" %}</a>{% endif %}
  {% for key, action in section.actions.items %}<a href="{% url 'settings:section_action' section.slug r.obj.pk key %}" class="btn-secondary">{{ action.0 }}</a>{% endfor %}
  {% if r.can_toggle %}
    <form method="post" action="{% url 'settings:section_toggle' section.slug r.obj.pk %}" {% if r.obj.is_active %}data-confirm="{% translate 'Deactivate this item?' %}"{% endif %}>{% csrf_token %}
      <button class="btn-ghost {% if r.obj.is_active %}text-rose-700{% endif %}">{% icon "power" "w-4 h-4" %}{% if r.obj.is_active %}{% translate "Deactivate" %}{% else %}{% translate "Activate" %}{% endif %}</button>
    </form>
  {% endif %}
</div>
